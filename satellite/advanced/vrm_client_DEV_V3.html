<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mina VRM Client V3 (Retargeter)</title>
    
    <!-- Config Loading -->
    <script src="vrm_config.js" onerror="console.log('No local config found')"></script>

    <!-- Import Maps Polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
            }
        }
    </script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0d0d16; color: white; font-family: monospace; }
        #status { position: absolute; top: 10px; left: 10px; padding: 8px; background: rgba(0,0,0,0.8); border: 1px solid #444; border-radius: 4px; pointer-events: none; z-index: 10; }
        #logs { position: absolute; bottom: 10px; left: 10px; width: 400px; height: 150px; overflow-y: auto; font-size: 12px; background: rgba(0,0,0,0.8); border: 1px solid #444; padding: 5px; pointer-events: none; }
        .log-entry { margin: 2px 0; border-bottom: 1px solid #222; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; font-size: 24px; text-shadow: 0 0 10px black; }
    </style>
</head>
<body>
    <div id="status">VRM Client V3: Initializing...</div>
    <div id="logs"></div>
    <div id="loading">RETARGETING IN PROGRESS...</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // --- Utils ---
        function log(msg, type='info') {
            console.log(`[V3] ${msg}`);
            const el = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.style.color = type === 'error' ? '#ff5555' : (type === 'warn' ? '#ffaa00' : '#88ccff');
            entry.textContent = `> ${msg}`;
            el.appendChild(entry);
            el.scrollTop = el.scrollHeight;
        }

        function setStatus(msg) {
            document.getElementById('status').textContent = `V3: ${msg}`;
        }

        // --- Configuration ---
        const params = new URLSearchParams(window.location.search);
        const config = window.VRM_CONFIG || {};
        const SETTINGS = {
            serverUrl: params.get('server') || config.server || 'wss://mina.nolanbc.ca',
            modelUrl: params.get('model') || 'https://mina.nolanbc.ca/assets/Mina.vrm',
            userId: params.get('userId') || 'VRM_V3',
            token: params.get('token') || config.token
        };

        // --- Globals ---
        let scene, camera, renderer, clock, currentVrm, mixer;
        let currentIdleAction = null;
        let currentGestureAction = null;
        const animationCache = {};
        let activeIdleName = 'Breathing Idle'; // Default idle


        // --- Life System Globals ---
        let isSpeaking = false;
        let isBlinking = false;
        let blinkTimer = Math.random() * 5 + 2;
        let blinkState = 0; // 0=open, 1=closed
        let blinkClosing = true;
        
        // Lip Sync
        const phonemes = ['aa', 'ih', 'ou', 'ee'];
        let currentPhoneme = 'aa';
        let phonemeTimer = 0;
        
        // Gaze
        const lookAtTargetObj = new THREE.Object3D();
        lookAtTargetObj.position.set(0, 1.5, 3.0);
        let lookTime = 0;

        // --- Mixamo -> VRM Bone Map ---
        // Enhanced map with fingers and alternatives
        const MIXAMO_MAP = {
            'hips': 'hips', 'mixamorig:Hips': 'hips', 'mixamorigHips': 'hips',
            'spine': 'spine', 'mixamorig:Spine': 'spine', 'mixamorigSpine': 'spine',
            'spine1': 'chest', 'mixamorig:Spine1': 'chest', 'mixamorigSpine1': 'chest',
            'spine2': 'upperChest', 'mixamorig:Spine2': 'upperChest', 'mixamorigSpine2': 'upperChest',
            'neck': 'neck', 'mixamorig:Neck': 'neck', 'mixamorigNeck': 'neck',
            'head': 'head', 'mixamorig:Head': 'head', 'mixamorigHead': 'head',
            'leftShoulder': 'leftShoulder', 'mixamorig:LeftShoulder': 'leftShoulder', 'mixamorigLeftShoulder': 'leftShoulder',
            'leftArm': 'leftUpperArm', 'mixamorig:LeftArm': 'leftUpperArm', 'mixamorigLeftArm': 'leftUpperArm',
            'leftForeArm': 'leftLowerArm', 'mixamorig:LeftForeArm': 'leftLowerArm', 'mixamorigLeftForeArm': 'leftLowerArm',
            'leftHand': 'leftHand', 'mixamorig:LeftHand': 'leftHand', 'mixamorigLeftHand': 'leftHand',
            'rightShoulder': 'rightShoulder', 'mixamorig:RightShoulder': 'rightShoulder', 'mixamorigRightShoulder': 'rightShoulder',
            'rightArm': 'rightUpperArm', 'mixamorig:RightArm': 'rightUpperArm', 'mixamorigRightArm': 'rightUpperArm',
            'rightForeArm': 'rightLowerArm', 'mixamorig:RightForeArm': 'rightLowerArm', 'mixamorigRightForeArm': 'rightLowerArm',
            'rightHand': 'rightHand', 'mixamorig:RightHand': 'rightHand', 'mixamorigRightHand': 'rightHand',
            'leftUpLeg': 'leftUpperLeg', 'mixamorig:LeftUpLeg': 'leftUpperLeg', 'mixamorigLeftUpLeg': 'leftUpperLeg',
            'leftLeg': 'leftLowerLeg', 'mixamorig:LeftLeg': 'leftLowerLeg', 'mixamorigLeftLeg': 'leftLowerLeg',
            'leftFoot': 'leftFoot', 'mixamorig:LeftFoot': 'leftFoot', 'mixamorigLeftFoot': 'leftFoot',
            'leftToeBase': 'leftToes', 'mixamorig:LeftToeBase': 'leftToes', 'mixamorigLeftToeBase': 'leftToes',
            'rightUpLeg': 'rightUpperLeg', 'mixamorig:RightUpLeg': 'rightUpperLeg', 'mixamorigRightUpLeg': 'rightUpperLeg',
            'rightLeg': 'rightLowerLeg', 'mixamorig:RightLeg': 'rightLowerLeg', 'mixamorigRightLeg': 'rightLowerLeg',
            'rightFoot': 'rightFoot', 'mixamorig:RightFoot': 'rightFoot', 'mixamorigRightFoot': 'rightFoot',
            'rightToeBase': 'rightToes', 'mixamorig:RightToeBase': 'rightToes', 'mixamorigRightToeBase': 'rightToes',
            
            // Fingers (Left)
            'mixamorig:LeftHandThumb1': 'leftThumbProximal', 'mixamorig:LeftHandThumb2': 'leftThumbIntermediate', 'mixamorig:LeftHandThumb3': 'leftThumbDistal',
            'mixamorig:LeftHandIndex1': 'leftIndexProximal', 'mixamorig:LeftHandIndex2': 'leftIndexIntermediate', 'mixamorig:LeftHandIndex3': 'leftIndexDistal',
            'mixamorig:LeftHandMiddle1': 'leftMiddleProximal', 'mixamorig:LeftHandMiddle2': 'leftMiddleIntermediate', 'mixamorig:LeftHandMiddle3': 'leftMiddleDistal',
            'mixamorig:LeftHandRing1': 'leftRingProximal', 'mixamorig:LeftHandRing2': 'leftRingIntermediate', 'mixamorig:LeftHandRing3': 'leftRingDistal',
            'mixamorig:LeftHandPinky1': 'leftLittleProximal', 'mixamorig:LeftHandPinky2': 'leftLittleIntermediate', 'mixamorig:LeftHandPinky3': 'leftLittleDistal',

            // Fingers (Right)
            'mixamorig:RightHandThumb1': 'rightThumbProximal', 'mixamorig:RightHandThumb2': 'rightThumbIntermediate', 'mixamorig:RightHandThumb3': 'rightThumbDistal',
            'mixamorig:RightHandIndex1': 'rightIndexProximal', 'mixamorig:RightHandIndex2': 'rightIndexIntermediate', 'mixamorig:RightHandIndex3': 'rightIndexDistal',
            'mixamorig:RightHandMiddle1': 'rightMiddleProximal', 'mixamorig:RightHandMiddle2': 'rightMiddleIntermediate', 'mixamorig:RightHandMiddle3': 'rightMiddleDistal',
            'mixamorig:RightHandRing1': 'rightRingProximal', 'mixamorig:RightHandRing2': 'rightRingIntermediate', 'mixamorig:RightHandRing3': 'rightRingDistal',
            'mixamorig:RightHandPinky1': 'rightLittleProximal', 'mixamorig:RightHandPinky2': 'rightLittleIntermediate', 'mixamorig:RightHandPinky3': 'rightLittleDistal',
        };

        // --- Init ---
        function init() {
            // Renderer
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // SRGB Encoding is important for VRM
            renderer.outputColorSpace = THREE.SRGBColorSpace; 
            document.body.appendChild(renderer.domElement);

            // Scene
            scene = new THREE.Scene();
            
            // Helpers
            const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(grid);
            scene.add(new THREE.AxesHelper(1)); // Red: X, Green: Y, Blue: Z
            scene.add(lookAtTargetObj);

            // Camera
            camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20.0);
            camera.position.set(0, 1.4, 3.5);

            // Light
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(1.0, 1.0, 1.0).normalize();
            scene.add(dirLight);
            
            // Orbit Controls
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.0, 0);
            controls.update();

            clock = new THREE.Clock();

            // Load Model
            loadVRM(SETTINGS.modelUrl);
            
            // Connect Socket
            connectSocket();

            animate();
        }

        // --- Load VRM ---
        function loadVRM(url) {
            setStatus('Loading VRM...');
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                if (currentVrm) {
                    scene.remove(currentVrm.scene);
                    VRMUtils.deepDispose(currentVrm.scene);
                }
                currentVrm = vrm;
                scene.add(vrm.scene);
                
                // Correction
                vrm.scene.rotation.y = Math.PI; // Standard VRM faces +Z, we want -Z (towards camera)
                VRMUtils.rotateVRM0(vrm); // Legacy fix if VRM0

                // Init Mixer
                mixer = new THREE.AnimationMixer(vrm.scene);
                
                // Force T-Pose
                vrm.humanoid.resetNormalizedPose();
                
                setStatus('VRM Loaded. Ready.');
                log(`VRM Loaded: ${vrm.meta?.metaVersion === '0' ? 'v0.0' : 'v1.0'}`);

                // Start Idle
                playAnimation('Breathing Idle', 0, true);
            }, 
            (xhr) => {}, 
            (err) => log('VRM Load Error', 'error'));
        }

        // --- CORE RETARGETING & ANIMATION ---
        
        async function getRetargetedClip(animationName) {
            // Check cache
            if (animationCache[animationName]) return animationCache[animationName];
            
            if (!currentVrm) return null;

            const filename = animationName.toLowerCase().endsWith('.fbx') ? animationName : `${animationName}.fbx`;
            let httpUrl = SETTINGS.serverUrl.replace(/^ws/, 'http');
            if(httpUrl.endsWith('/')) httpUrl = httpUrl.slice(0, -1);
            const url = `${httpUrl}/assets/animations/${filename}`;

            log(`Fetching: ${filename}`);
            document.getElementById('loading').style.display = 'block';

            try {
                const loader = new FBXLoader();
                const asset = await loader.loadAsync(url);
                document.getElementById('loading').style.display = 'none';
                
                // 1. Scene Analysis
                let mixamoHips = asset.getObjectByName('mixamorig:Hips') || asset.getObjectByName('mixamorigHips');
                if (!mixamoHips) {
                     asset.traverse((child) => {
                         if (!mixamoHips && child.isBone && child.name.includes('Hips')) mixamoHips = child;
                     });
                }
                
                if (!mixamoHips) throw new Error('Could not find Hips bone in FBX');
                
                // 2. Compute Target Scale
                mixamoHips.updateWorldMatrix(true, true);
                const mixamoHipsY = mixamoHips.getWorldPosition(new THREE.Vector3()).y;
                
                const vrmHipsNode = currentVrm.humanoid.getNormalizedBoneNode('hips');
                const vrmHipsY = vrmHipsNode.getWorldPosition(new THREE.Vector3()).y;
                
                let positionScale = 1.0;
                if (Math.abs(mixamoHipsY) > 0.0001) {
                    positionScale = vrmHipsY / mixamoHipsY;
                }
                log(`Scale Factor: ${positionScale.toFixed(4)}`);

                // 3. Process Animation Clip
                asset.updateMatrixWorld(true);
                const clip = asset.animations[0];
                if (!clip) throw new Error('No animation in FBX');

                const tracks = [];
                
                const getMixamoBone = (name) => {
                    return asset.getObjectByName(name) || 
                           asset.getObjectByName(name.replace('mixamorig:', 'mixamorig')) ||
                           asset.getObjectByName(name.replace('mixamorig', 'mixamorig:'));
                };

                clip.tracks.forEach((track) => {
                    const trackName = track.name;
                    const parts = trackName.split('.');
                    const prop = parts.pop();
                    const boneName = parts.join('.'); // Mixamo Name
                    
                    const cleanName = boneName.replace(/^.*:/, ''); 
                    let vrmBoneName = MIXAMO_MAP[boneName] || MIXAMO_MAP[cleanName];
                    if (!vrmBoneName && boneName.startsWith('mixamorig')) {
                        vrmBoneName = MIXAMO_MAP[boneName.replace('mixamorig', 'mixamorig:')];
                    }
                    if (!vrmBoneName) return; 
                    
                    const vrmNode = currentVrm.humanoid.getNormalizedBoneNode(vrmBoneName);
                    if (!vrmNode) return;

                    if (prop === 'position') {
                        if (vrmBoneName === 'hips') {
                            const newTrack = track.clone();
                            newTrack.name = `${vrmNode.name}.position`;
                            for (let i = 0; i < newTrack.values.length; i++) {
                                newTrack.values[i] *= positionScale;
                            }
                            tracks.push(newTrack);
                        }
                    } else if (prop === 'quaternion') {
                        const newTrack = track.clone();
                        newTrack.name = `${vrmNode.name}.quaternion`;
                        
                        const mixamoBone = getMixamoBone(boneName);
                        if (mixamoBone) {
                            const restQuat = new THREE.Quaternion();
                            mixamoBone.getWorldQuaternion(restQuat);
                            const invRestQuat = restQuat.clone().invert();
                            
                            const parentQuat = new THREE.Quaternion();
                            if (mixamoBone.parent) {
                                mixamoBone.parent.getWorldQuaternion(parentQuat);
                            }
                            
                            const values = newTrack.values;
                            const q = new THREE.Quaternion();
                            
                            for (let i = 0; i < values.length; i += 4) {
                                q.set(values[i], values[i+1], values[i+2], values[i+3]);
                                q.premultiply(parentQuat).multiply(invRestQuat);
                                
                                if (currentVrm.meta.metaVersion === '0') {
                                    q.x *= -1;
                                    q.z *= -1;
                                }

                                values[i] = q.x;
                                values[i+1] = q.y;
                                values[i+2] = q.z;
                                values[i+3] = q.w;
                            }
                        }
                        tracks.push(newTrack);
                    }
                });

                // 4. Cache and Return
                const retargetedClip = new THREE.AnimationClip(animationName, clip.duration, tracks);
                animationCache[animationName] = retargetedClip;
                return retargetedClip;

            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                log(`Error: ${e.message}`, 'error');
                return null;
            }
        }

        async function playAnimation(name, customDuration = 0, isIdle = false) {
            try {
                if (!mixer) return;
                const clip = await getRetargetedClip(name);
                if (!clip) return;

                const action = mixer.clipAction(clip);
                
                if (isIdle) {
                    // Start Idle
                    if (currentIdleAction !== action) {
                        if (currentIdleAction) currentIdleAction.fadeOut(0.5);
                        action.reset().fadeIn(0.5).play();
                        currentIdleAction = action;
                        activeIdleName = name;
                    }
                    action.setLoop(THREE.LoopRepeat);
                    action.clampWhenFinished = false;
                    setStatus(`Idle: ${name}`);
                } else {
                    // Play Gesture
                    // Fade out gesture if one exists
                    if (currentGestureAction) currentGestureAction.fadeOut(0.2);
                    
                    // Fade out idle to avoid conflict
                    if (currentIdleAction) currentIdleAction.fadeOut(0.2);

                    action.reset().fadeIn(0.2).play();
                    action.setLoop(THREE.LoopRepeat);
                    currentGestureAction = action;
                    
                    setStatus(`Gesture: ${name}`);
                    log(`Playing Gesture: ${name} (${customDuration || 'Loop'}s)`);

                    if (customDuration && customDuration > 0) {
                        setTimeout(() => {
                            if (currentGestureAction === action) {
                                action.fadeOut(0.5);
                                currentGestureAction = null;
                                // Restore Idle
                                if (currentIdleAction) {
                                    currentIdleAction.reset().fadeIn(0.5).play();
                                    setStatus(`Idle: ${activeIdleName}`);
                                } else {
                                    playAnimation(activeIdleName, 0, true);
                                }
                            }
                        }, customDuration * 1000);
                    }
                }
            } catch (e) {
                log(`Anim Error: ${e.message}`, 'error');
            }
        }

        // Backward compat
        const loadAndRetargetAnimation = (name, dur) => playAnimation(name, dur, false);

        // --- Life System Logic ---
        function updateLife(delta) {
            if (!currentVrm) return;
            const elapsed = clock.elapsedTime;

            // 1. Blinking
            if (isBlinking) {
                const speed = 15.0 * delta;
                if (blinkClosing) {
                    blinkState += speed;
                    if (blinkState >= 1) { blinkState = 1; blinkClosing = false; }
                } else {
                    blinkState -= speed;
                    if (blinkState <= 0) { blinkState = 0; isBlinking = false; }
                }
                currentVrm.expressionManager.setValue('blink', blinkState);
            } else {
                blinkTimer -= delta;
                if (blinkTimer <= 0) {
                    isBlinking = true;
                    blinkClosing = true;
                    blinkTimer = Math.random() * 4 + 2;
                }
            }

            // 2. Lip Sync & Speaking
            if (isSpeaking) {
                phonemeTimer -= delta;
                if (phonemeTimer <= 0) {
                    phonemeTimer = 0.05 + Math.random() * 0.1;
                    currentPhoneme = phonemes[Math.floor(Math.random() * phonemes.length)];
                }
                
                const mouthOpen = (Math.sin(elapsed * 20) * 0.5 + 0.5) * 0.7;
                
                // Apply active phoneme, reset others
                phonemes.forEach(p => {
                    const val = (p === currentPhoneme) ? mouthOpen : 0;
                    currentVrm.expressionManager.setValue(p, val);
                });
            } else {
                phonemes.forEach(p => currentVrm.expressionManager.setValue(p, 0));
            }

            // 3. Subtle Breathing / Head Sway
            // VRM LookAt handles head rotation if we move the target
            lookTime += delta * 0.5;
            lookAtTargetObj.position.x = Math.sin(lookTime) * 0.2;
            lookAtTargetObj.position.y = 1.5 + Math.cos(lookTime * 0.7) * 0.1;
            
            if (currentVrm.lookAt) {
                if (currentVrm.lookAt.target !== lookAtTargetObj) {
                    currentVrm.lookAt.target = lookAtTargetObj;
                }
                currentVrm.lookAt.update(delta);
            }
        }

        // --- Socket ---
        function connectSocket() {
            const socket = io(SETTINGS.serverUrl);
            socket.on('connect', () => {
                setStatus('Connected to Server');
                log('Socket Connected');
                socket.emit('register', { userId: SETTINGS.userId, token: SETTINGS.token });
            });
            
            socket.on('gesture', (data) => loadAndRetargetAnimation(data.type, data.duration));
            socket.on('emote', (data) => loadAndRetargetAnimation(data.type, data.duration));

            // Life Events
            socket.on('speaking_start', () => { log('Speaking Start'); isSpeaking = true; });
            socket.on('speaking_stop', () => { log('Speaking Stop'); isSpeaking = false; });
            
            socket.on('mood_update', (data) => {
                log(`Mood Update: ${JSON.stringify(data)}`);
                if (!currentVrm) return;
                
                // Clear mutually exclusive emotions
                ['happy', 'angry', 'sad', 'neutral', 'fun', 'sorrow'].forEach(e => {
                   currentVrm.expressionManager.setValue(e, 0); 
                });

                const level = data.level !== undefined ? data.level : 50;
                let target = 'neutral';
                let weight = 0.0;
                let idleAnim = 'Breathing Idle';

                if (level < 20) { 
                    target = 'happy'; weight = 0.6; // Toned down from 1.0
                    idleAnim = 'Happy Idle';
                }
                else if (level < 40) { 
                    target = 'neutral'; weight = 0.5; 
                    idleAnim = 'Breathing Idle';
                }
                else if (level < 80) { 
                    target = 'sad'; weight = 0.5; 
                    idleAnim = 'Breathing Idle'; // Or Sad Idle if we have it
                } 
                else { 
                    target = 'angry'; weight = 1.0; 
                    idleAnim = 'Angry'; // 'Angry.fbx'
                }

                if (target !== 'neutral') {
                    currentVrm.expressionManager.setValue(target, weight);
                }
                
                // Switch Idle Animation if different
                if (idleAnim !== activeIdleName) {
                    playAnimation(idleAnim, 0, true);
                }
            });
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            updateLife(delta);

            if (currentVrm) currentVrm.update(delta);
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        // Start
        init();
        
        // Debug
        window.play = loadAndRetargetAnimation;
    </script>
</body>
</html>
